# Private graders for `vgi-lint simulate` (VGI416). The worker publishes only
# task names and prompts in vgi.agent_test_tasks; these canonical solutions and
# grading options stay in the repo and are merged by task name.
tasks:
  - name: match-failed-network-logon
    reference_sql: "SELECT sigma.main.sigma_match('{\"EventID\": 4625, \"LogonType\": 3}', '{title: Failed Network Logon, logsource: {service: security}, detection: {selection: {EventID: 4625, LogonType: 3}, condition: selection}}') AS matched"
    ignore_column_names: true
  - name: validate-sigma-rule
    reference_sql: "SELECT sigma.main.sigma_check('{title: Failed Logon, logsource: {service: security}, detection: {selection: {EventID: 4625}, condition: selection}}') AS valid"
    ignore_column_names: true
  - name: read-rule-title-and-level
    reference_sql: "SELECT title, level FROM sigma.main.sigma_rule_info('{title: Failed Logon, level: high, logsource: {service: security}, detection: {selection: {EventID: 4625}, condition: selection}}')"
    ignore_column_names: true
  - name: list-referenced-fields
    reference_sql: "SELECT field FROM sigma.main.sigma_match_fields('{title: Failed Network Logon, logsource: {service: security}, detection: {selection: {EventID: 4625, LogonType: 3}, condition: selection}}')"
    ignore_column_names: true
    unordered: true
  - name: count-supported-modifiers
    reference_sql: "SELECT count(*) AS affix_modifiers FROM sigma.main.supported_modifiers WHERE kind = 'affix'"
    ignore_column_names: true
  - name: rule-library-hit-counts
    reference_sql: "WITH rules(rule_name, rule) AS (VALUES ('rdp_failure', '{title: Failed RDP Logon, logsource: {product: windows, service: security}, detection: {selection: {EventID: 4625, LogonType: 10}, condition: selection}}'), ('powershell_service', '{title: PowerShell Service Install, logsource: {product: windows, service: system}, detection: {selection: {EventID: 7045, ServiceFileName|contains: powershell}, condition: selection}}'), ('high_port', '{title: High Destination Port, logsource: {category: network_connection}, detection: {selection: {DestinationPort|gt: 1024}, condition: selection}}')), logs(event_id, event) AS (VALUES (1, '{\"EventID\": 4625, \"LogonType\": 10, \"TargetUserName\": \"admin\"}'), (2, '{\"EventID\": 4625, \"LogonType\": 3, \"TargetUserName\": \"admin\"}'), (3, '{\"EventID\": 4624, \"LogonType\": 10, \"TargetUserName\": \"admin\"}'), (4, '{\"EventID\": 4625, \"LogonType\": 10, \"TargetUserName\": \"guest\"}')), usable AS (SELECT rule_name, rule FROM rules WHERE sigma.main.sigma_check(rule)) SELECT u.rule_name, count(l.event_id) AS hits FROM usable AS u LEFT JOIN logs AS l ON sigma.main.sigma_match(l.event, u.rule) GROUP BY u.rule_name ORDER BY u.rule_name"
    ignore_column_names: true
  - name: count-missing-rule-fields
    reference_sql: "WITH logs(event_id, event) AS (VALUES (1, '{\"EventID\": 7045, \"ServiceName\": \"updater\", \"ServiceFileName\": \"powershell.exe -nop -enc SQBFAFgA\"}'), (2, '{\"EventID\": 7045, \"ServiceName\": \"spooler2\"}'), (3, '{\"Provider\": \"Service Control Manager\"}')) SELECT l.event_id::INTEGER AS event_id, sigma.main.sigma_match(l.event, '{title: Suspicious Service Install, logsource: {product: windows, service: system}, detection: {selection: {EventID: 7045, ServiceFileName|contains: powershell}, condition: selection}}') AS matched, count(f.field) FILTER (WHERE json_extract(l.event, '$.' || f.field) IS NULL) AS missing_fields FROM logs AS l CROSS JOIN sigma.main.sigma_match_fields('{title: Suspicious Service Install, logsource: {product: windows, service: system}, detection: {selection: {EventID: 7045, ServiceFileName|contains: powershell}, condition: selection}}') AS f GROUP BY l.event_id, l.event ORDER BY l.event_id"
    ignore_column_names: true
